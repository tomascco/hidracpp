name: CMake

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        # Directory to install Qt
        dir: ${{ github.workspace }}/Qt
        cache: true

    - name: Configure CMake
      # QT_ROOT_DIR is set by install-qt-action (e.g. .../Qt/5.15.2/msvc2019_64)
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DQT_PATH="${{env.QT_ROOT_DIR}}"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

    - name: Package (executable + Qt DLLs)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force hidra-windows | Out-Null
        Copy-Item build/src/${{env.BUILD_TYPE}}/hidracpp.exe hidra-windows/
        windeployqt --release --no-translations hidra-windows/hidracpp.exe

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: hidracpp-windows
        path: hidra-windows
        if-no-files-found: error

  linux:
    # Rocky Linux 9 container: uses the distribution's Qt 5.15 packages, so the
    # executable runs on RHEL/Rocky/Alma 9 with the system Qt (dnf install qt5-qtbase-gui)
    runs-on: ubuntu-latest
    container: rockylinux:9

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: dnf install -y gcc-c++ make cmake qt5-qtbase-devel

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DQT_PATH=/usr

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} -j"$(nproc)"

    - name: Test
      working-directory: build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: hidracpp-linux-rocky9
        path: build/src/hidracpp
        if-no-files-found: error
